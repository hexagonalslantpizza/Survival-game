<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17231d" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%2317231d%22/%3E%3Cpath d=%22M32 7 12 54h9l11-26 11 26h9L32 7Z%22 fill=%22%23a8bf8a%22/%3E%3C/svg%3E" />
    <meta name="description" content="A first-person tropical wilderness survival game." />
    <title>WILDLANDS — Survival</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="start-screen" class="screen">
      <div class="menu-panel">
        <div class="eyebrow">A WILDERNESS SURVIVAL EXPERIENCE</div>
        <h1>WILDLANDS</h1>
        <p class="subtitle">The forest is alive. Learn to live in it.</p>
        <button id="start-button">ENTER THE FOREST</button>
        <p class="controls-note">WASD move <span>•</span> Mouse look <span>•</span> E interact <span>•</span> H inspect watch</p>
      </div>
    </div>
    <div id="pause-screen" class="screen hidden">
      <div class="menu-panel compact">
        <div class="eyebrow">WILDERNESS SURVIVAL</div>
        <h2>PAUSED</h2>
        <button id="resume-button">RETURN TO GAME</button>
        <p class="controls-note">Press Esc to resume</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
